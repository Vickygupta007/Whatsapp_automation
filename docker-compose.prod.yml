version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: whatsapp_rio_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_rio_erp}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_rio_erp_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-whatsapp_rio_erp}?schema=public
      NGROK_ENABLED: "false"
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-1225478070642817}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-rio_erp_verify_2026}
      WHATSAPP_USE_MOCK: ${WHATSAPP_USE_MOCK:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RIO_ERP_BASE_URL: ${RIO_ERP_BASE_URL:-http://200.234.35.179:3000}
      RIO_ERP_API_KEY: ${RIO_ERP_API_KEY:-rio_whatsapp_secret_key_2026}
      RIO_ERP_USE_MOCK: ${RIO_ERP_USE_MOCK:-true}

volumes:
  pgdata_prod:
