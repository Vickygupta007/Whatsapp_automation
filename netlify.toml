# Netlify Configuration for WhatsApp Optical ERP Admin Dashboard
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: ensure all frontend routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
