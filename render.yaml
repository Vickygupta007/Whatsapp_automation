# Render Blueprint Specification for WhatsApp Rio ERP Automation
# Deploy both Full Frontend Dashboard & Backend Webhook Server with free SSL domain + Managed PostgreSQL
services:
  - type: web
    name: whatsapp-rio-erp-automation
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: (npm --prefix backend run prisma:push || true) && npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 3000
      - key: NGROK_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-erp-db
          property: connectionString
      - key: WHATSAPP_VERIFY_TOKEN
        value: "rio_erp_verify_2026"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1327525300446181"
      - key: GEMINI_API_KEY
        sync: false
      - key: RIO_ERP_BASE_URL
        value: "http://200.234.35.179:3000"
      - key: RIO_ERP_API_KEY
        value: "rio_whatsapp_secret_key_2026"
      - key: RIO_ERP_USE_MOCK
        value: "false"
      - key: WHATSAPP_USE_MOCK
        value: "false"

databases:
  - name: whatsapp-erp-db
    plan: free
    databaseName: whatsapp_rio_erp
    user: erp_admin
    region: oregon
